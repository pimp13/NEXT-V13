name: next-app-prod

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: next-app:prod
    container_name: next_web
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    ports:
      - "3000:3000"
    restart: unless-stopped
